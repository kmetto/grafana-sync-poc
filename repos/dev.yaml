apiVersion: provisioning.grafana.app/v0alpha1
kind: Repository
metadata:
  name: poc-dev
spec:
  title: Git Sync POC (dev)
  type: github
  github:
    url: ${GITHUB_REPO_URL}
    branch: dev
    path: grafana/
  sync:
    enabled: true
    intervalSeconds: 30
    target: folder
  workflows:
    - write
secure:
  token:
    create: ${GITHUB_TOKEN}
