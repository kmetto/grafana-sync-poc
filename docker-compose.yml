x-grafana: &grafana
  image: grafana/grafana:13.2.3
  restart: unless-stopped
  environment:
    GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
    GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    GF_AUTH_ANONYMOUS_ENABLED: "false"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- localhost:3000/api/health || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  grafana-dev:
    <<: *grafana
    container_name: grafana-dev
    ports: ["3000:3000"]
    volumes: ["grafana-dev-data:/var/lib/grafana"]

  grafana-client-1:
    <<: *grafana
    container_name: grafana-client-1
    ports: ["3001:3000"]
    volumes: ["grafana-client-1-data:/var/lib/grafana"]

  grafana-client-2:
    <<: *grafana
    container_name: grafana-client-2
    ports: ["3002:3000"]
    volumes: ["grafana-client-2-data:/var/lib/grafana"]

  grafana-client-3:
    <<: *grafana
    container_name: grafana-client-3
    ports: ["3003:3000"]
    volumes: ["grafana-client-3-data:/var/lib/grafana"]

volumes:
  grafana-dev-data:
  grafana-client-1-data:
  grafana-client-2-data:
  grafana-client-3-data:
